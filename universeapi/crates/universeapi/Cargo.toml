[package]
name = "universeapi"
description = "UniverseAPI Engine — unified catalog, metadata, streaming and download engine for Velmora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chacha20.workspace = true
chrono.workspace = true
fastrand.workspace = true
hmac.workspace = true
md-5.workspace = true
futures.workspace = true
html-escape.workspace = true
regex.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
librqbit = { workspace = true, optional = true }
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }
zip.workspace = true

[features]
default = ["torrent"]
# BitTorrent download + stream-while-downloading (librqbit)
torrent = ["dep:librqbit"]
# Chrome-fingerprint fallback for sites that block the normal client (BoringSSL)
impersonate = ["dep:wreq", "dep:wreq-util"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
