[workspace]
resolver = "2"
members = ["crates/universeapi", "crates/universeapi-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/ashfaqizop/Velmora"
authors = ["siliconcode-dev <siliconxcode@gmail.com>", "ashfaqizop <ashfaqizop@gmail.com>"]

[workspace.dependencies]
universeapi = { path = "crates/universeapi" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
hmac = "0.12"
md-5 = "0.10"
futures = "0.3"
html-escape = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "brotli", "cookies", "stream"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
# Chrome-fingerprint fallback (BoringSSL)
wreq = "0.16"
wreq-util = { version = "0.2", features = ["emulation"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# torrent engine; rustls build so Android needs no OpenSSL
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
tracing = "0.1"
url = "2"
# cli only
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
