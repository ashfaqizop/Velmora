name: Bug report
description: Something in Velmora doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: I dragged the seek bar to 1:10:00 and playback jumped to 1:42:00.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for "Dune"
        2. Open the 2021 movie and press Play
        3. ...
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title and source
      description: If it only happens with some videos, which title, episode and source (shown on the player's Sources button).
      placeholder: "Clayface, 1080p · HDHub"
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Velmora version
      description: Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images in here. For a visual problem, a screenshot helps more than a description.
