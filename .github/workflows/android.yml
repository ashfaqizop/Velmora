name: Velmora Android

# Every build runs here: there is no Gradle or Android Studio on the dev PC.
# A push to main that touches android/ produces a signed debug APK to test
# (it installs as com.velmora.stepbyte.debug, next to a release build).

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null

      # The release key signs debug builds too, so test builds update in place.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > keystore.jks; fi

      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUniversalGmsDebug --stacktrace --no-configuration-cache

      - name: Name the APK
        run: |
          short=$(git rev-parse --short HEAD)
          mkdir -p out
          cp app/build/outputs/apk/universalGms/debug/*.apk "out/Velmora-debug-$short.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: velmora-android-debug
          path: android/out/*.apk
          retention-days: 14

      - name: Remove the key
        if: always()
        run: rm -f keystore.jks
