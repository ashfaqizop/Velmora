name: Velmora Android

# Every build runs here: there is no Gradle, Android Studio or cargo on the dev PC.
# A push to main that touches android/ or the engine produces a signed debug APK
# to test (it installs as com.velmora.stepbyte.debug, next to a release build).
# A release tag (app-vX.Y.Z, the same tag as desktop) builds the release APKs
# and attaches them to that GitHub Release, next to the Windows installer.
#
# The Rust engine (android/engine/rust, a UniFFI wrapper around UniverseAPI) is
# built first with cargo-ndk into android/engine/src/main/jniLibs, and its Kotlin
# bindings are generated from the built library. Both are gitignored.

on:
  push:
    branches: [main]
    # Path filters don't apply to tags, so every app-v tag builds.
    paths: ["android/**", "universeapi/crates/universeapi/**", ".github/workflows/android.yml"]
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Build the release APKs (to test them before tagging)
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.release) && 'Release APK' || 'Debug APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      RELEASE: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.release) && '1' || '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/engine/rust
          key: android-engine

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # TMDB and sports keys are built in, the same as the desktop release.
      - name: Rust engine
        working-directory: android/engine/rust
        env:
          VELMORA_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          VELMORA_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VELMORA_SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          VELMORA_FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -t armeabi-v7a -P 26 -o ../src/main/jniLibs build --release -p velmora-engine
          ls -la ../src/main/jniLibs/*

      - name: Kotlin bindings
        working-directory: android/engine/rust
        run: |
          cargo run -p uniffi-bindgen -- generate \
            --library target/aarch64-linux-android/release/libvelmora_engine.so \
            --language kotlin --out-dir ../src/main/kotlin --no-format
          find ../src/main/kotlin/com/velmora/stepbyte/engine/ffi -name '*.kt' -exec wc -l {} +

      # The release key signs debug builds too, so test builds update in place.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > keystore.jks; fi

      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          chmod +x gradlew
          if [ -n "$RELEASE" ]; then
            [ -f keystore.jks ] || { echo "a release needs the signing key"; exit 1; }
            ./gradlew :app:assembleUniversalGmsRelease --stacktrace --no-configuration-cache
          else
            ./gradlew :app:assembleUniversalGmsDebug --stacktrace --no-configuration-cache
          fi

      - name: Name the APK
        run: |
          mkdir -p out/universal out/arm64
          if [ -n "$RELEASE" ]; then
            ver=$(grep -oP 'versionName = "K[^"]+' app/build.gradle.kts)
            if [[ "$GITHUB_REF_NAME" == app-v* && "$GITHUB_REF_NAME" != "app-v$ver" ]]; then echo "tag and versionName differ"; exit 1; fi
            echo "VERSION=$ver" >> "$GITHUB_ENV"
            cp app/build/outputs/apk/universalGms/release/*.apk "out/universal/Velmora-$ver-android-universal.apk"
          else
            short=$(git rev-parse --short HEAD)
            cp app/build/outputs/apk/universalGms/debug/*.apk "out/universal/Velmora-debug-$short.apk"
          fi

      # A smaller copy for 64-bit phones (most of them): the same APK without
      # the 32-bit libraries, re-signed with the same key so it installs over
      # either build.
      - name: 64-bit APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -f keystore.jks ] || { echo "no signing key, skipping"; exit 0; }
          if [ -n "$RELEASE" ]; then name="Velmora-$VERSION-android-arm64.apk"; else name="Velmora-debug-$(git rev-parse --short HEAD)-arm64.apk"; fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          work=$(mktemp -d)
          cp out/universal/*.apk "$work/in.apk"
          zip -q -d "$work/in.apk" 'lib/armeabi-v7a/*' 'lib/armeabi/*' 'lib/x86/*' 'lib/x86_64/*' || true
          "$bt/zipalign" -f -p 4 "$work/in.apk" "$work/aligned.apk"
          "$bt/apksigner" sign --ks keystore.jks --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "out/arm64/$name" "$work/aligned.apk"
          "$bt/apksigner" verify "out/arm64/$name"
          rm -rf "$work"
          ls -la out/universal out/arm64

      - uses: actions/upload-artifact@v4
        with:
          name: velmora-android-debug
          path: android/out/universal/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: velmora-android-debug-arm64
          path: android/out/arm64/*.apk
          if-no-files-found: ignore
          retention-days: 14

      # Desktop's workflow makes the Release for the same tag; wait for it,
      # then add the APKs.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 90); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            echo "waiting for the release ($i)"; sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" out/arm64/*.apk out/universal/*.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove the key
        if: always()
        run: rm -f keystore.jks
