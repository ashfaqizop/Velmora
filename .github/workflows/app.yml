name: Velmora app

on:
  push:
    branches: [main]
    paths: ["app/**", "universeapi/crates/universeapi/**", ".github/workflows/app.yml"]
    tags: ["app-v*"]
  pull_request:
    paths: ["app/**", "universeapi/crates/universeapi/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows build
    needs: frontend
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: NASM for BoringSSL
        uses: ilammy/setup-nasm@v1
      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # Tags (app-vX.Y.Z) publish a signed release plus latest.json for the in-app updater.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VELMORA_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          VELMORA_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VELMORA_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VELMORA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          VELMORA_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        with:
          projectPath: app
          tagName: app-v__VERSION__
          releaseName: Velmora v__VERSION__
          releaseBody: See the commit history for what changed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Every other run builds the installer as an artifact to try out.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VELMORA_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          VELMORA_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VELMORA_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VELMORA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          VELMORA_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: npm run tauri build
      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: velmora-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload Cargo.lock
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-cargo-lock
          path: app/src-tauri/Cargo.lock
