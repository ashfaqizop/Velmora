name: Velmora app

on:
  push:
    branches: [main]
    paths: ["app/**", "universeapi/crates/universeapi/**", ".github/workflows/app.yml"]
    tags: ["app-v*"]
  pull_request:
    paths: ["app/**", "universeapi/crates/universeapi/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows build
    needs: frontend
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: NASM for BoringSSL
        uses: ilammy/setup-nasm@v1
      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # Tags (app-vX.Y.Z) publish a signed release plus latest.json for the in-app updater.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VELMORA_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          VELMORA_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VELMORA_SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          VELMORA_FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          VELMORA_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VELMORA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        with:
          projectPath: app
          tagName: app-v__VERSION__
          releaseName: Velmora v__VERSION__
          releaseBody: See the commit history for what changed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Every other run builds the installer as an artifact to try out.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VELMORA_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          VELMORA_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VELMORA_SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          VELMORA_FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          VELMORA_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VELMORA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        shell: bash
        # Pull requests from forks get no secrets: build without the signed updater files.
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build
          else
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v5
        with:
          name: velmora-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload Cargo.lock
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v5
        with:
          name: app-cargo-lock
          path: app/src-tauri/Cargo.lock

  android:
    name: Android build (arm64)
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android
      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # The release keystore comes from secrets. Without it (forks, or before
      # the secret exists) CI builds a debug APK instead.
      - name: Release keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            dir=app/src-tauri/gen/android
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/velmora.jks"
            {
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "password=$ANDROID_KEY_PASSWORD"
              echo "storeFile=$RUNNER_TEMP/velmora.jks"
            } > "$dir/keystore.properties"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: app
        env:
          VELMORA_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          VELMORA_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VELMORA_SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          VELMORA_FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          VELMORA_ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          VELMORA_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        shell: bash
        run: |
          # ANDROID_NDK_LATEST_HOME is a runner env var, not a workflow-context one
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ "$SIGNED" = "1" ]; then
            npm run tauri android build -- --apk --target aarch64
          else
            npm run tauri android build -- --apk --target aarch64 --debug
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: velmora-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
