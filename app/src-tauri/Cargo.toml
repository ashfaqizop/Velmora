[package]
name = "velmora"
version = "0.4.0"
description = "Velmora: movies, series and anime, one engine"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/ashfaqizop/Velmora"
publish = false

[lib]
name = "velmora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
ed25519-dalek = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
universeapi = { path = "../../universeapi/crates/universeapi" }
# Music's local database (musicdb.rs). Bundled, so nothing to install.
rusqlite = { version = "0.32", features = ["bundled"] }

# Desktop only: OTA updates, and the Chrome-fingerprint fallback (BoringSSL
# doesn't build for Android yet).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-libmpv = "0.3"
# Windows media controls (SMTC) for Music, see media.rs.
souvlaki = "0.7"
universeapi = { path = "../../universeapi/crates/universeapi", features = ["impersonate"] }

# Max licenses: Credential Manager for the key, the registry for the PC's ID.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"
# DPAPI for the YouTube Music cookie jar (music.rs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"
